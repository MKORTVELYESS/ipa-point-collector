name: Submit IPA ratings

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (use self-hosted if github-hosted IPs are blocked)"
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
  schedule:
    # Weekdays 18:30 UTC (~19:30 CET / 20:30 CEST)
    - cron: "30 18 * * 1-5"

jobs:
  submit:
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    # Required so Environment secrets (EK_USERNAME / EK_PASSWORD) are available
    environment: prod
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build
        run: mvn -B -q package

      - name: Check site reachability
        run: |
          code=$(curl -sS -o /tmp/ek-home.html -w "%{http_code}" -A "Mozilla/5.0" \
            "https://egeszsegkonyha.hu/" || echo "curl-failed")
          echo "homepage HTTP $code"
          if ! grep -q 'csrf.token\|ialLogin' /tmp/ek-home.html 2>/dev/null; then
            echo "::error::Homepage has no CSRF/login form — runner IP is likely blocked."
            head -c 400 /tmp/ek-home.html || true
            exit 1
          fi
          echo "Homepage looks OK."

      - name: Check credentials
        env:
          EK_USERNAME: ${{ secrets.EK_USERNAME }}
          EK_PASSWORD: ${{ secrets.EK_PASSWORD }}
        run: |
          missing=
          [ -z "$EK_USERNAME" ] && missing="$missing EK_USERNAME"
          [ -z "$EK_PASSWORD" ] && missing="$missing EK_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing:$missing"
            echo "Expected Environment secrets on 'prod': EK_USERNAME, EK_PASSWORD"
            echo "Settings → Environments → prod → Environment secrets"
            exit 1
          fi
          echo "Credentials present (username length=${#EK_USERNAME})."

      - name: Submit IPA forms (3 stars)
        env:
          EK_USERNAME: ${{ secrets.EK_USERNAME }}
          EK_PASSWORD: ${{ secrets.EK_PASSWORD }}
        run: java -jar target/ipa-point-collector-1.0.0.jar
