name: Submit IPA ratings

# No cron: local machine dispatches this on boot via scripts/trigger-ipa.ps1
on:
  workflow_dispatch:

jobs:
  submit:
    runs-on: self-hosted
    environment: prod
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build
        run: mvn -B -q package

      - name: Submit IPA forms (3 stars)
        env:
          EK_USERNAME: ${{ secrets.EK_USERNAME }}
          EK_PASSWORD: ${{ secrets.EK_PASSWORD }}
        run: java -jar target/ipa-point-collector-1.0.0.jar
